                        const formatted = new Intl.NumberFormat(document.documentElement.lang || undefined).format(count);
                        const label = document.documentElement.lang.startsWith("zh") ? "全站浏览：" : "Site views:";
                        element.textContent = `${label} ${formatted}`;
                    })
