# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Sign in from /admin/ with a GitHub fine-grained personal access token that has
# Contents: Read and write access to this repository. The token stays only in
# the browser's local storage; do not add it to this file or commit it.
backend:
  name: github
  repo: Jingyuan-Zheng/hugo-main
  branch: main

# Keep Hugo's existing English index.md / Chinese index.zh.md page-bundle
# convention. Single-language articles remain independent and are exposed
# through a compatibility collection without creating unpublished translations.
i18n:
  structure: multiple_files
  locales: [en, zh]
  default_locale: en
  omit_default_locale_from_file_path: true
  omit_default_locale_from_preview_path: true
  initial_locales: [en, zh]

# All existing public Hugo images live here. Article image folders stay intact.
media_folder: /static/img
public_folder: /img

collections:

  - name: single_language_loader_bewlybewly_safari_revival
    label: "Single-language loader: Bewlybewly Safari Revival"
    folder: content/post
    path: bewlybewly-safari-revival/index.zh
    extension: md
    format: yaml-frontmatter
    i18n: false
    create: false
    hide: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL slug, name: slug, widget: string, required: false }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Published date, name: date, widget: datetime, required: false }
      - { label: Cover image, name: image, widget: image, required: false }
