  - name: posts
    label: Create or edit bilingual posts
    label_singular: Blog post
    folder: /content/post
    path: '{{slug}}/index'
    slug: '{{fields.slug}}'
    media_folder: '{{media_folder}}/{{dirname}}'
    public_folder: '{{public_folder}}/{{dirname}}'
    i18n: true
    extension: md
    format: frontmatter
    summary: '{{title}} — {{date}} ({{locales}})'
    preview_path: '/p/{{slug}}/'
    thumbnail: image
    fields:
      - label: Title
        name: title
        widget: string
        i18n: true
      - label: URL slug
        name: slug
        widget: string
        i18n: duplicate
        hint: Stable URL identifier; do not change it after publishing.
      - label: Description
        name: description
        widget: text
        required: false
        i18n: true
      - label: Published date
        name: date
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ssZ'
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm'
        i18n: duplicate
      - label: Cover image
        name: image
        widget: image
        required: false
        i18n: duplicate
        hint: Upload a new image or use an existing site path such as /img/post-name/featured.png.
      - label: Categories
        name: categories
        widget: relation
        required: false
        collection: taxonomies
        file: categories
        multiple: true
        value_field: '{{categories.*.name}}'
        display_fields: ['{{categories.*.name}}']
        search_fields: ['{{categories.*.name}}']
        i18n: true
      - label: Tags
        name: tags
        widget: relation
        required: false
        collection: taxonomies
        file: tags
        multiple: true
        value_field: '{{tags.*.name}}'
        display_fields: ['{{tags.*.name}}']
        search_fields: ['{{tags.*.name}}']
        i18n: true
      - label: Article
        name: body
        widget: markdown
        i18n: true


